# Canary :05 -- asks GitHub to run this every hour at minute 05 and does nothing else.
# The measurement is not what this job prints; it is when GitHub creates the run, read back
# from the Actions API by scripts/collect.mjs and compared with the minute it was asked for.
name: "canary :05"
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "canary :05 ran at $(date -u +%FT%TZ) for schedule '${{ github.event.schedule }}' (event ${{ github.event_name }})"
